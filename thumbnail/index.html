import React, { useState, useEffect, useRef, useMemo } from 'react';

// ============ Firebase init ============
let app, auth, db;
const appId = window.APP_ID || 'default-app-id';
try {

const basePath = (name) => ['artifacts', appId, 'public', 'data', name];
const colRef = (name) => collection(db, ...basePath(name));
const docRefFn = (name, id) => doc(db, ...basePath(name), id);

// ============ 画像圧縮（チーム共有設定） ============
// 設定はFirestore settings/compress: { maxSize: 長辺px(0=原寸), quality: 0.5〜0.9 }
const COMPRESS_DEFAULT = { maxSize: 1200, quality: 0.7 };
// 常に最新の圧縮設定を同期的に読めるようキャッシュ（onSnapshotで更新）
let liveCompress = { ...COMPRESS_DEFAULT };
if (db) {
  try { onSnapshot(docRefFn('settings', 'compress'), (s) => { if (s.exists()) liveCompress = { ...COMPRESS_DEFAULT, ...s.data() }; }); }
  catch (e) { console.warn('compress snapshot', e); }
}
async function getCompressSettings() {
  try {
    if (db) {
      const s = await getDoc(docRefFn('settings', 'compress'));
      if (s.exists()) { liveCompress = { ...COMPRESS_DEFAULT, ...s.data() }; return liveCompress; }
    }
  } catch (e) { console.warn('compress settings', e); }
  return { ...COMPRESS_DEFAULT };
}
// canvasを直接・同期的に圧縮してJPEG dataURLを返す（iOS Safariのダウンロード対策：
// タップ直後の同期処理でないと保存が失敗し拡張子が付かないため、awaitを挟まない）
function compressCanvasSync(srcCanvas, cfg) {
  const c2 = cfg || liveCompress || COMPRESS_DEFAULT;
  let w = srcCanvas.width, h = srcCanvas.height;
  const long = Math.max(w, h);
  if (c2.maxSize && long > c2.maxSize) { const r = c2.maxSize / long; w = Math.round(w * r); h = Math.round(h * r); }
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const ctx = c.getContext('2d');
  ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, w, h);
  ctx.drawImage(srcCanvas, 0, 0, w, h);
  return c.toDataURL('image/jpeg', c2.quality);
}
// dataURL → 長辺maxSizeに縮小し、JPEG(quality)で再圧縮したdataURLを返す（一括圧縮用・非同期）
function compressDataUrl(srcUrl, maxSize, quality) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => {
      let w = img.width, h = img.height;
      const long = Math.max(w, h);
      if (maxSize && long > maxSize) { const r = maxSize / long; w = Math.round(w * r); h = Math.round(h * r); }
      const c = document.createElement('canvas'); c.width = w; c.height = h;
      const ctx = c.getContext('2d');
      ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, w, h); // 透過PNG対策で白背景
      ctx.drawImage(img, 0, 0, w, h);
      resolve(c.toDataURL('image/jpeg', quality));
    };
    img.onerror = () => reject(new Error('画像を読み込めませんでした'));
    img.src = srcUrl;
  });
}
function dataUrlKb(u) { return Math.round((u.length - u.indexOf(',') - 1) * 3 / 4 / 1024); }

// ============ メール通知（GAS Webhook経由・クライアント別設定） ============
// 設定はFirestoreの settings/notify にチーム共有で保存:
// { gasUrl, perAccount: { [accountId]: { enabled, emails } } }
async function sendGalleryNotify({ accountId, accountName, categoryName, folderName }) {
  try {
    if (!db) return;
    const snap = await getDoc(docRefFn('settings', 'notify'));
    if (!snap.exists()) return;
    const s = snap.data();
    const acc = (s.perAccount || {})[accountId];
    if (!s.gasUrl || !acc || !acc.enabled || !(acc.emails || '').trim()) return;
    await fetch(s.gasUrl, {
      method: 'POST', mode: 'no-cors',
      headers: { 'Content-Type': 'text/plain' },
      body: JSON.stringify({
        type: 'gallery_saved',
        emails: acc.emails,
        account: accountName, category: categoryName, title: folderName,
        when: new Date().toLocaleString('ja-JP'),
      }),
    });
  } catch (e) { console.error('notify error', e); }
}

// ============ Helpers ============
// ファイル名の安全化（studio側 safeImgName と完全一致のルール）。
// GMO/Windowsで不正値になる半角・全角記号を _ に統一し、アップロードエラーを防ぐ。
// 予定の状態ラベル（studio側のpostStatus/doneに対応）
function schedStatusLabel(x){
  const st = x.postStatus || (x.posted ? 'posted' : '');
  if(st==='retired')  return '🗂未使用';
  if(st==='posted')   return '✅投稿済';
  if(st==='canceled') return '🚫取消';
  if(st==='mistake')  return '⚠️誤投稿';
  if(x.done)          return '📤出力済';
  return '⬜未着手';
}
function schedOptionLabel(x){
  const d = (x.date||'未定').slice(5).replace('-','/');
  const img = x.imageTitle ? (x.imageId ? '🖼️' : '⚠️') : '❌';
  return `${d} ${x.time||''} ${schedStatusLabel(x)} ${img}｜${(x.catchTitle||x.title||'無題').slice(0,18)}`;
}
// 一覧に出す予定：投稿済み/取消も含め、直近3ヶ月＋未来をすべて表示
function selectableScheds(schedules){
  const lim = new Date(); lim.setMonth(lim.getMonth()-3);
  const min = lim.toISOString().slice(0,10);
  return (schedules||[]).filter(x=> (x.postStatus||'')!=='retired').filter(x=> !x.date || x.date >= min)
    .sort((a,b)=> (b.date||'').localeCompare(a.date||''));
}
function safeNameStr(s) {
  return String(s ?? '').normalize('NFC')           // 濁点分離（NFD）の名前も同じ文字列に揃える
    .replace(/[\\/:*?"<>|]/g, '_')                 // 半角の禁止文字
    .replace(/[：／＊？＜＞｜「」【】（）　]/g, '_')   // 全角の禁止文字・全角スペース
    .replace(/[、。！？・，．～〜＆＃％＄＠＋＝；'‘’“”『』〈〉《》〔〕［］｛｝!,;#%&+=@'`\[\]{}]/g, '_') // 句読点・記号（「、」入りでGMO画像エラーの実績あり）
    .replace(/_+/g, '_')                            // 連続 _ を圧縮
    .replace(/^[_.]+|[_.]+$/g, '')                  // 先頭末尾の _ . を除去
    .trim();
}
function sanitizePart(s) { return safeNameStr(s); }
function buildFolderName({ accountName, categoryName, date, memo }) {
  const acc = sanitizePart(accountName) || '未分類';
  const cat = sanitizePart(categoryName) || '未分類';
  const m = sanitizePart(memo);
  // 日付が空だと「◯◯_.jpg」という照合しにくい名前になるため今日の日付で補完
  const d = date || isoToMMDD(todayISO());
  // 区切りは _ に統一（以前は全角「：」でGMOアップロード時に不正値になっていた）
  let s = `${acc}_${cat}_${d}`;
  if (m) s += `_${m}`;
  // 念のため全体を安全化（連続 _ の圧縮・端の掃除）
  return safeNameStr(s);
}
function todayISO() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}
function isoToMMDD(iso) {
  if (!iso) return '';
  const p = iso.split('-'); return p.length === 3 ? `${p[1]}-${p[2]}` : '';
}
function fmtDateTime(ms) {
  if (!ms) return '';
  return new Date(ms).toLocaleString('ja-JP', { year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit' });
}
async function copyToClipboard(text) {
  try { await navigator.clipboard.writeText(text); return true; }
  catch {
    const ta = document.createElement('textarea');
    ta.value = text; document.body.appendChild(ta);
    ta.select(); document.execCommand('copy'); document.body.removeChild(ta);
    return true;
  }
}
function useLocalStorage(key, initial) {
  const [v, setV] = useState(() => {
    try { const r = localStorage.getItem(key); return r ? JSON.parse(r) : initial; } catch { return initial; }
  });
  useEffect(() => { try { localStorage.setItem(key, JSON.stringify(v)); } catch {} }, [key, v]);
  return [v, setV];
}

// ============ NotifySettings（メール通知設定） ============
function NotifySettings({ accounts, showToast }) {
  const [cfg, setCfg] = useState(null);
  const [saving, setSaving] = useState(false);

  useEffect(() => {
    (async () => {
      try {
        const snap = await getDoc(docRefFn('settings', 'notify'));
        setCfg(snap.exists() ? { gasUrl: '', perAccount: {}, ...snap.data() } : { gasUrl: '', perAccount: {} });
      } catch (e) { console.error(e); setCfg({ gasUrl: '', perAccount: {} }); }
    })();
  }, []);

  if (!cfg) return <p className="text-sm text-slate-400">読み込み中...</p>;

  const accCfg = (id) => ({ enabled: false, emails: '', ...(cfg.perAccount || {})[id] });
  const setAcc = (id, patch) => setCfg({ ...cfg, perAccount: { ...(cfg.perAccount || {}), [id]: { ...accCfg(id), ...patch } } });

  const save = async () => {
    setSaving(true);
    try {
      await setDoc(docRefFn('settings', 'notify'), cfg);
      showToast('通知設定を保存しました（チーム共有）');
    } catch (e) { console.error(e); showToast('保存に失敗しました'); }
    finally { setSaving(false); }
  };

  const test = async () => {
    if (!cfg.gasUrl.trim()) { showToast('先に通知用URLを設定してください'); return; }
    const emails = [...new Set(Object.values(cfg.perAccount || {}).filter(a => a.enabled).flatMap(a => (a.emails || '').split(/[,、\s]+/)).filter(Boolean))].join(',');
    if (!emails) { showToast('ONのアカウントに通知先メールがありません'); return; }
    try {
      await fetch(cfg.gasUrl.trim(), {
        method: 'POST', mode: 'no-cors', headers: { 'Content-Type': 'text/plain' },
        body: JSON.stringify({ type: 'test', emails, account: 'テスト', category: '-', title: 'テスト送信', when: new Date().toLocaleString('ja-JP') }),
      });
      showToast('テストを送信しました。メールを確認してください');
    } catch (e) { console.error(e); showToast('送信に失敗しました'); }
  };

  return (
    <div className="space-y-4">
      <p className="text-xs text-slate-500 leading-relaxed bg-blue-50 text-blue-900 p-3 rounded-lg">
        チームギャラリーに画像が保存されたとき、クライアント（運用アカウント）ごとに設定したメールへ通知します。設定はチーム全体で共有されます。
      </p>
      <div>
        <label className="text-xs font-medium text-slate-500 block mb-1">通知用URL（GASウェブアプリのURL）</label>
        <input value={cfg.gasUrl} onChange={(e) => setCfg({ ...cfg, gasUrl: e.target.value })} placeholder="https://script.google.com/macros/s/…/exec" className="w-full p-2 border rounded text-sm font-mono" />
      </div>
      <div className="space-y-2">
        <div className="text-xs font-medium text-slate-500">クライアントごとの通知先</div>
        {accounts.length === 0 && <p className="text-sm text-slate-400">運用アカウントがまだありません</p>}
        {accounts.map(a => {
          const c = accCfg(a.id);
          return (
            <div key={a.id} className="border rounded-lg p-3 space-y-2">
              <label className="flex items-center gap-2 text-sm font-medium">
                <input type="checkbox" className="w-4 h-4" checked={c.enabled} onChange={(e) => setAcc(a.id, { enabled: e.target.checked })} />
                {a.name}
                <span className={`text-[10px] px-1.5 py-0.5 rounded-full ${c.enabled ? 'bg-emerald-100 text-emerald-700' : 'bg-slate-100 text-slate-400'}`}>{c.enabled ? '通知ON' : 'OFF'}</span>
              </label>
              <input value={c.emails} onChange={(e) => setAcc(a.id, { emails: e.target.value })} placeholder="通知先Gmail（カンマ区切りで複数可）" className="w-full p-2 border rounded text-sm" disabled={!c.enabled} />
            </div>
          );
        })}
      </div>
      <div className="flex gap-2">
        <button onClick={save} disabled={saving} className="flex-1 bg-blue-600 hover:bg-blue-700 disabled:bg-slate-300 text-white py-2.5 rounded-lg font-medium text-sm">{saving ? '保存中...' : '保存する'}</button>
        <button onClick={test} className="flex-1 bg-white border border-slate-300 hover:bg-slate-50 text-slate-700 py-2.5 rounded-lg font-medium text-sm">テスト送信</button>
      </div>
      <details className="text-xs text-slate-500">
        <summary className="cursor-pointer">初回セットアップ（通知用URLの作り方）</summary>
        <ol className="list-decimal ml-4 mt-2 space-y-1 leading-relaxed">
          <li>script.google.com で「新しいプロジェクト」を作成</li>
          <li>担当から受け取ったGASコードを貼り付けて保存</li>
          <li>「デプロイ」→「新しいデプロイ」→ 種類「ウェブアプリ」</li>
          <li>実行ユーザー「自分」／アクセスできるユーザー「全員」でデプロイ</li>
          <li>表示されたURL（…/exec）を上の欄に貼って保存</li>
        </ol>
      </details>
    </div>
  );
}

// ============ CompressSection（画質設定＋一括圧縮） ============
function CompressSection({ showToast }) {
  const [cfg, setCfg] = useState(null);
  const [busy, setBusy] = useState(false);
  const [progress, setProgress] = useState('');
  const fileRef = useRef(null);

  useEffect(() => { (async () => setCfg(await getCompressSettings()))(); }, []);

  if (!cfg) return <p className="text-sm text-slate-400">読み込み中...</p>;

  const saveCfg = async () => {
    try {
      await setDoc(docRefFn('settings', 'compress'), cfg);
      showToast('圧縮設定を保存しました（チーム共有）');
    } catch (e) { console.error(e); showToast('保存に失敗しました'); }
  };

  const readAsDataUrl = (blob) => new Promise((res, rej) => { const r = new FileReader(); r.onload = (ev) => res(ev.target.result); r.onerror = rej; r.readAsDataURL(blob); });
  const extOk = (name) => /\.(png|jpe?g|webp|gif|bmp)$/i.test(name);

  const runBulk = async (files) => {
    if (!files || !files.length) return;
    setBusy(true); setProgress('準備中...');
    try {
      // 入力を集める（画像ファイル＋ZIPの中身）
      const items = []; // {name, blob}
      for (const f of files) {
        if (/\.zip$/i.test(f.name)) {
          const zin = await JSZip.loadAsync(f);
          const entries = Object.values(zin.files).filter(e => !e.dir && extOk(e.name) && !e.name.startsWith('__MACOSX'));
          for (const e of entries) items.push({ name: e.name.split('/').pop(), blob: await e.async('blob') });
        } else if (f.type.startsWith('image/') || extOk(f.name)) {
          items.push({ name: f.name, blob: f });
        }
      }
      if (!items.length) { showToast('画像が見つかりませんでした'); setBusy(false); setProgress(''); return; }

      const zout = new JSZip();
      let done = 0, before = 0, after = 0, failed = 0;
      for (const item of items) {
        setProgress(`圧縮中... ${done + 1} / ${items.length}`);
        try {
          const src = await readAsDataUrl(item.blob);
          const out = await compressDataUrl(src, cfg.maxSize, cfg.quality);
          before += Math.round(item.blob.size / 1024); after += dataUrlKb(out);
          const outName = item.name.replace(/\.\w+$/, '') + '.jpg';
          zout.file(outName, out.split(',')[1], { base64: true });
        } catch (e) { console.warn('skip', item.name, e); failed++; }
        done++;
      }
      setProgress('ZIPを作成中...');
      const blob = await zout.generateAsync({ type: 'blob' });
      const d = new Date();
      const stamp = `${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = `圧縮画像_${stamp}.zip`;
      a.click(); URL.revokeObjectURL(a.href);
      setProgress(`✅ 完了：${done - failed}枚を圧縮（${before}KB → ${after}KB）${failed ? ` ／ ${failed}枚は読み込めずスキップ` : ''}`);
    } catch (e) {
      console.error(e); setProgress('❌ 失敗しました：' + e.message);
    } finally {
      setBusy(false);
      if (fileRef.current) fileRef.current.value = '';
    }
  };

  return (
    <div className="space-y-5">
      <section className="space-y-3">
        <h3 className="text-sm font-bold text-slate-700">保存時の画質（チーム共有）</h3>
        <p className="text-xs text-slate-500 leading-relaxed bg-blue-50 text-blue-900 p-3 rounded-lg">
          「PCに保存」「ギャラリー保存」の画像は、ここで設定したサイズ・画質の軽量JPGになります（MEOの表示速度対策）。
        </p>
        <div className="grid grid-cols-2 gap-3">
          <div>
            <label className="text-xs font-medium text-slate-500 block mb-1">長辺サイズ（px）</label>
            <select value={cfg.maxSize} onChange={(e) => setCfg({ ...cfg, maxSize: Number(e.target.value) })} className="w-full p-2 border rounded text-sm bg-white">
              <option value={800}>800px（最軽量）</option>
              <option value={1000}>1000px</option>
              <option value={1200}>1200px（推奨）</option>
              <option value={1600}>1600px（高精細）</option>
              <option value={0}>縮小しない（原寸）</option>
            </select>
          </div>
          <div>
            <label className="text-xs font-medium text-slate-500 block mb-1">画質</label>
            <select value={cfg.quality} onChange={(e) => setCfg({ ...cfg, quality: Number(e.target.value) })} className="w-full p-2 border rounded text-sm bg-white">
              <option value={0.5}>50%（最軽量）</option>
              <option value={0.6}>60%</option>
              <option value={0.7}>70%（推奨）</option>
              <option value={0.8}>80%</option>
              <option value={0.9}>90%（高画質）</option>
            </select>
          </div>
        </div>
        <button onClick={saveCfg} className="w-full bg-blue-600 hover:bg-blue-700 text-white py-2.5 rounded-lg font-medium text-sm">設定を保存</button>
      </section>

      <section className="space-y-3 border-t pt-4">
        <h3 className="text-sm font-bold text-slate-700">過去画像の一括圧縮</h3>
        <p className="text-xs text-slate-500 leading-relaxed">
          画像を複数選択（またはZIPごと）でアップロードすると、上の設定で一括圧縮して<b>ZIPでダウンロード</b>できます。差し替え用にどうぞ。
        </p>
        <label className={`flex flex-col items-center justify-center w-full h-28 border-2 border-dashed rounded-xl cursor-pointer ${busy ? 'opacity-50 pointer-events-none' : 'border-slate-300 bg-slate-50 hover:bg-slate-100'}`}>
          <Upload className="w-6 h-6 mb-1 text-slate-400" />
          <p className="text-sm font-medium text-slate-600">{busy ? '処理中...' : '画像（複数可）またはZIPを選択'}</p>
          <p className="text-[10px] text-slate-400 mt-0.5">PNG / JPG / WEBP / ZIP</p>
          <input ref={fileRef} type="file" className="hidden" multiple accept="image/*,.zip" onChange={(e) => runBulk([...e.target.files])} />
        </label>
        {progress && <p className="text-xs text-slate-600 bg-slate-50 rounded-lg p-3 whitespace-pre-wrap">{progress}</p>}
      </section>
    </div>
  );
}

// ============ HamburgerMenu ============
function HamburgerMenu({ onClose, accounts, categories, projects, selectedProjectId, setSelectedProjectId, showToast }) {
  const [section, setSection] = useState('main');
  const [confirm, setConfirm] = useState(null);

  const addAccount = async (name) => {
    if (!name.trim()) return;
    await addDoc(colRef('accounts'), { name: name.trim(), createdAt: Date.now() });
    showToast('アカウントを追加しました');
  };
  const renameAccount = async (id, name) => {
    if (!name.trim()) return;
    await updateDoc(docRefFn('accounts', id), { name: name.trim() });
  };
  const deleteAccount = async (a) => {
    const cats = categories.filter(c => c.accountId === a.id);
    const projs = projects.filter(p => p.accountId === a.id);
    setConfirm({
      title: `「${a.name}」を削除しますか？`,
      body: `関連する画像カテゴリ${cats.length}件、プロジェクト${projs.length}件も一緒に削除されます。\n（過去に保存されたギャラリー画像は残ります）`,
      onConfirm: async () => {
        await Promise.all(cats.map(c => deleteDoc(docRefFn('categories', c.id))));
        await Promise.all(projs.map(p => deleteDoc(docRefFn('projects', p.id))));
        await deleteDoc(docRefFn('accounts', a.id));
        showToast('削除しました');
        setConfirm(null);
      },
      onCancel: () => setConfirm(null),
    });
  };
  const addCategory = async (accountId, name) => {
    if (!name.trim() || !accountId) return;
    await addDoc(colRef('categories'), { name: name.trim(), accountId, createdAt: Date.now() });
  };
  const renameCategory = async (id, name) => {
    if (!name.trim()) return;
    await updateDoc(docRefFn('categories', id), { name: name.trim() });
  };
  const deleteCategory = async (c) => {
    const projs = projects.filter(p => p.categoryId === c.id);
    setConfirm({
      title: `「${c.name}」を削除しますか？`,
      body: projs.length ? `このカテゴリを使うプロジェクト${projs.length}件も削除されます。` : `削除します。`,
      onConfirm: async () => {
        await Promise.all(projs.map(p => deleteDoc(docRefFn('projects', p.id))));
        await deleteDoc(docRefFn('categories', c.id));
        showToast('削除しました');
        setConfirm(null);
      },
      onCancel: () => setConfirm(null),
    });
  };
  const addProject = async ({ name, accountId, categoryId }) => {
    if (!name.trim() || !accountId || !categoryId) return;
    const a = accounts.find(x => x.id === accountId);
    const c = categories.find(x => x.id === categoryId);
    await addDoc(colRef('projects'), {
      name: name.trim(), accountId, categoryId,
      accountName: a?.name || '', categoryName: c?.name || '',
      createdAt: Date.now(),
    });
  };
  const deleteProject = async (p) => {
    setConfirm({
      title: `「${p.name}」を削除しますか？`,
      body: '選択中の場合は自動で解除されます。',
      onConfirm: async () => {
        await deleteDoc(docRefFn('projects', p.id));
        if (selectedProjectId === p.id) setSelectedProjectId(null);
        showToast('削除しました');
        setConfirm(null);
      },
      onCancel: () => setConfirm(null),
    });
  };

  return (
    <>
      <div className="fixed inset-0 bg-slate-900/40 z-40" onClick={onClose} />
      <aside className="fixed top-0 right-0 h-full w-full sm:w-[420px] bg-white shadow-2xl z-50 flex flex-col">
        <div className="flex items-center justify-between p-4 border-b bg-slate-50">
          <h2 className="font-bold text-slate-800 flex items-center gap-2">
            {section !== 'main' && (
              <button onClick={() => setSection('main')} className="text-slate-500 hover:text-slate-800"><ChevronLeft className="w-5 h-5" /></button>
            )}
            {section === 'main' ? 'メニュー' : section === 'accounts' ? '運用アカウント管理' : section === 'categories' ? '画像カテゴリ管理' : section === 'projects' ? 'プロジェクト管理' : section === 'release' ? 'リリース情報' : section === 'notify' ? 'メール通知設定' : section === 'compress' ? '画質・一括圧縮' : '改善・問合せ'}
          </h2>
          <button onClick={onClose} className="p-1 hover:bg-slate-200 rounded"><X className="w-5 h-5" /></button>
        </div>
        <div className="flex-1 overflow-y-auto p-4 space-y-2">
          {section === 'main' && (
            <>
              <MenuBtn icon={Sparkles} label="リリース情報" onClick={() => setSection('release')} />
              <MenuBtn icon={Mail} label="改善・問合せ" onClick={() => setSection('contact')} />
              <div className="border-t my-3" />
              <MenuBtn icon={Users} label="運用アカウント管理" onClick={() => setSection('accounts')} sub={`${accounts.length}件`} />
              <MenuBtn icon={Tag} label="画像カテゴリ管理" onClick={() => setSection('categories')} sub={`${categories.length}件`} />
              <MenuBtn icon={Folder} label="プロジェクト管理" onClick={() => setSection('projects')} sub={`${projects.length}件`} />
              <MenuBtn icon={Mail} label="メール通知設定" onClick={() => setSection('notify')} sub="ギャラリー保存時" />
              <MenuBtn icon={Settings} label="画質・一括圧縮" onClick={() => setSection('compress')} sub="保存画質の設定／過去画像の一括圧縮" />
            </>
          )}
          {section === 'release' && <div className="text-sm text-slate-700 whitespace-pre-wrap leading-relaxed bg-slate-50 p-4 rounded-lg">{RELEASE_NOTES}</div>}
          {section === 'contact' && (
            <div className="space-y-3">
              <p className="text-sm text-slate-600">下記のテンプレートをコピーして、担当（HARUKA）宛にお送りください。</p>
              <textarea readOnly value={CONTACT_TEMPLATE} className="w-full h-56 p-3 border rounded-lg text-sm font-mono bg-slate-50" />
              <button onClick={async () => { await copyToClipboard(CONTACT_TEMPLATE); showToast('テンプレートをコピーしました'); }} className="w-full bg-blue-600 hover:bg-blue-700 text-white py-2.5 rounded-lg font-medium text-sm flex items-center justify-center gap-2"><Copy className="w-4 h-4" />コピーする</button>
            </div>
          )}
          {section === 'notify' && <NotifySettings accounts={accounts} showToast={showToast} />}
          {section === 'compress' && <CompressSection showToast={showToast} />}
          {section === 'accounts' && <AccountManager accounts={accounts} onAdd={addAccount} onRename={renameAccount} onDelete={deleteAccount} />}
          {section === 'categories' && <CategoryManager accounts={accounts} categories={categories} onAdd={addCategory} onRename={renameCategory} onDelete={deleteCategory} />}
          {section === 'projects' && <ProjectManager accounts={accounts} categories={categories} projects={projects} selectedProjectId={selectedProjectId} setSelectedProjectId={setSelectedProjectId} onAdd={addProject} onDelete={deleteProject} />}
        </div>
      </aside>
      {confirm && <ConfirmModal {...confirm} />}
    </>
  );
}

        <select value={accId} onChange={(e) => setAccId(e.target.value)} className="w-full p-2 border rounded text-sm">

// ============ デザイン編集パネル ============
const TD = window.ThumbDesign;
function Sl({ label, value, min, max, step, onChange, fmt }) {
  return (<label className="block text-xs text-slate-600"><span className="flex justify-between"><span>{label}</span><span className="text-slate-400">{fmt ? fmt(value) : value}</span></span>
    <input type="range" min={min} max={max} step={step || 1} value={value} onChange={e => onChange(Number(e.target.value))} className="w-full accent-[#2F6D80]" /></label>);
}
function ColorF({ label, value, onChange }) {
  return (<div className="text-xs text-slate-600 flex items-center gap-2"><span className="w-14 shrink-0">{label}</span>
    <input type="color" value={value || '#ffffff'} onChange={e => onChange(e.target.value)} className="w-8 h-8 p-0 border rounded shrink-0" />
    <div className="flex gap-1 flex-wrap">{TD.COLOR_CHIPS.map(c => <button key={c} type="button" onClick={() => onChange(c)} className="w-5 h-5 rounded-full border border-slate-300" style={{ background: c, outline: value === c ? '2px solid #2F6D80' : 'none', outlineOffset: 1 }} />)}</div></div>);
}
function Sel({ label, value, opts, onChange }) {
  return (<label className="text-xs text-slate-600 flex items-center gap-2"><span className="w-14 shrink-0">{label}</span>
    <select value={value} onChange={e => onChange(e.target.value)} className="flex-1 min-w-0 p-1.5 border rounded text-xs">{opts.map(o => <option key={o[0]} value={o[0]}>{o[1]}</option>)}</select></label>);
}
function Acc({ title, open, children }) {
  return (<details open={open} className="border border-slate-200 rounded-lg bg-white"><summary className="cursor-pointer select-none px-3 py-2 text-sm font-semibold text-slate-700">{title}</summary><div className="px-3 pb-3 space-y-2">{children}</div></details>);
}
function DesignPanel({ design, setDesign, selectedCell, setSelectedCell, onPickFiles, photoSrcs, onRemovePhoto, templates = [], onSaveTemplate, onDeleteTemplate, showToast }) {
  const d = design;
  const up = (path, v) => setDesign(prev => { const o = JSON.parse(JSON.stringify(prev)); let cur = o; const ks = path.split('.'); for (let i = 0; i < ks.length - 1; i++) { if (cur[ks[i]] == null) cur[ks[i]] = {}; cur = cur[ks[i]]; } cur[ks[ks.length - 1]] = v; return o; });
  const n = TD.cellCount(d.template);
  const fileRef = useRef(null);
  const pick = (i) => { setSelectedCell(i); if (fileRef.current) fileRef.current.click(); };
  const p = (d.photos || [])[selectedCell] || {};
  const hasSel = !!photoSrcs[selectedCell];
  const fontOpts = Object.keys(TD.FONT_LABEL).map(k => [k, TD.FONT_LABEL[k]]);
  const isNone = d.template === 'none';
  const pct = v => Math.round(v * 100) + '%';
  const [tplName, setTplName] = useState('');
  const [presetKey, setPresetKey] = useState(d.template === 'none' ? 'none' : (TD.PRESET_ORDER.find(k => TD.PRESETS[k].apply().template === d.template) || 'single'));
  useEffect(() => { if (d.template === 'none') setPresetKey('none'); }, [d.template]);
  const lastDesign = (() => { try { return JSON.parse(localStorage.getItem('thumb_design_last') || 'null'); } catch (e) { return null; } })();
  const applySaved = (saved) => setDesign(prev => { const o = TD.merge(prev, saved || {}); const n2 = TD.cellCount(o.template); o.photos = (prev.photos || []).slice(0, n2); while (o.photos.length < n2) o.photos.push({ zoom: 1, dx: 0, dy: 0 }); return o; });
  // まとめて配置：ラベル・タイトル・サブを縦横9か所へ
  const placeAll = (h, v) => setDesign(prev => {
    const o = JSON.parse(JSON.stringify(prev));
    const x = h === 'left' ? 0.06 : h === 'right' ? 0.94 : 0.5;
    const base = v === 'top' ? 0.3 : v === 'bottom' ? 0.74 : 0.5;
    ['label', 'title', 'sub'].forEach(k => { o[k].align = h; o[k].x = x; });
    o.label.y = base - 0.15; o.title.y = base; o.sub.y = base + 0.15;
    return o;

  const AlignRow = ({ k }) => (<div className="flex items-center gap-2 text-xs text-slate-600"><span className="w-14 shrink-0">揃え</span>
    <div className="flex gap-1">{[['left', '左'], ['center', '中'], ['right', '右']].map(o => <button key={o[0]} type="button" onClick={() => { up(`${k}.align`, o[0]); up(`${k}.x`, o[0] === 'left' ? 0.06 : o[0] === 'right' ? 0.94 : 0.5); }} className={`px-3 py-1 rounded border ${(d[k].align || 'center') === o[0] ? 'border-[#2F6D80] bg-[#EAF3F4] font-bold' : 'border-slate-200 bg-white'}`}>{o[1]}</button>)}</div></div>);
  return (<div className="space-y-3">

      <button key={k} type="button" onClick={() => { setPresetKey(k); setDesign(prev => TD.applyPreset(prev, k)); }} className={`rounded-lg border p-1.5 text-[11px] leading-tight ${on ? 'border-[#2F6D80] bg-[#EAF3F4] text-[#24505E] font-bold' : 'border-slate-200 bg-white text-slate-600'}`}>
        <div className="text-base">{icon}</div>{pr.name}</button>); })}</div>
    <p className="text-[11px] text-slate-500">{TD.PRESETS[presetKey] ? TD.PRESETS[presetKey].hint : ''}。テンプレを選んだあと、下の項目で自由に変えられます</p>
    {/* マイテンプレ */}
    {!isNone && (<div className="border border-dashed border-[#CBDFE4] rounded-lg p-2 space-y-1.5 bg-[#F6FAFB]">
      <div className="text-[11px] font-bold text-[#24505E]">💾 マイテンプレ（作ったデザインを保存して次回も使う）</div>
      <div className="flex flex-wrap gap-1.5">
        {lastDesign && lastDesign.template && lastDesign.template !== 'none' && <button type="button" onClick={() => { applySaved(lastDesign); showToast && showToast('前回のデザインを呼び出しました'); }} className="text-[11px] bg-white border border-slate-300 rounded-full px-2.5 py-1">⏪ 前回のデザイン</button>}
        {templates.map(t => (<span key={t.id} className="inline-flex items-center bg-white border border-[#2F6D80]/40 rounded-full pl-2.5 pr-1 py-0.5 text-[11px]">
          <button type="button" onClick={() => { applySaved(t.design); showToast && showToast(`「${t.name}」を呼び出しました`); }} className="font-medium text-[#24505E]">{t.name}</button>
          <button type="button" onClick={() => onDeleteTemplate && onDeleteTemplate(t)} className="ml-1 w-5 h-5 rounded-full text-slate-400 hover:text-red-500 hover:bg-red-50" title="削除">×</button></span>))}
        {!templates.length && !lastDesign && <span className="text-[11px] text-slate-400">まだありません</span>}
      </div>

        <button type="button" disabled={!tplName.trim()} onClick={() => { onSaveTemplate && onSaveTemplate(tplName.trim(), TD.strip(d)); setTplName(''); }} className="text-xs bg-[#2F6D80] disabled:bg-slate-300 text-white px-3 py-1.5 rounded font-medium">保存</button>
      </div>
    </div>)}
    <div className={`grid ${n === 4 ? 'grid-cols-4' : n === 3 ? 'grid-cols-3' : 'grid-cols-1'} gap-1.5`}>{Array.from({ length: n }).map((_, i) => { const src = photoSrcs[i]; const sel = selectedCell === i; return (

        {n > 1 && <span className="absolute top-1 left-1 bg-black/50 text-white text-[10px] px-1.5 rounded">{i + 1}</span>}
      </button>); })}</div>
    <div className="flex gap-2 flex-wrap text-xs">
      <button type="button" onClick={() => pick(selectedCell)} className="bg-blue-50 text-blue-700 px-3 py-1.5 rounded font-medium">📷 写真を選ぶ{n > 1 ? '（複数まとめてOK）' : ''}</button>
