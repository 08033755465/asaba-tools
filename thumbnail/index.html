      </Acc>
      <Acc title="🌫️ 透かし・帯">
        <div className="flex gap-1.5">{[['none', 'なし'], ['dark', '全体を暗く'], ['gradient', 'グラデ'], ['band', '帯']].map(o => <button key={o[0]} type="button" onClick={() => up('overlay.type', o[0])} className={`flex-1 text-xs py-1.5 rounded border ${d.overlay.type === o[0] ? 'border-[#2F6D80] bg-[#EAF3F4] font-bold' : 'border-slate-200 bg-white'}`}>{o[1]}</button>)}</div>
        {d.overlay.type === 'dark' && (<><Sl label="暗さ（透かし具合）" value={d.overlay.opacity} min={0} max={0.8} step={0.01} onChange={v => up('overlay.opacity', v)} fmt={pct} /><ColorF label="色" value={d.overlay.color} onChange={v => up('overlay.color', v)} /></>)}
        {d.overlay.type === 'gradient' && (<>
          <Sel label="向き" value={(d.overlay.gradient || {}).dir || 'bottom'} opts={[['bottom', '下から'], ['top', '上から']]} onChange={v => up('overlay.gradient.dir', v)} />
          <Sl label="濃さ" value={(d.overlay.gradient || {}).opacity != null ? d.overlay.gradient.opacity : 0.75} min={0.1} max={1} step={0.01} onChange={v => up('overlay.gradient.opacity', v)} fmt={pct} />
          <Sl label="広さ" value={(d.overlay.gradient || {}).size != null ? d.overlay.gradient.size : 0.6} min={0.2} max={1} step={0.01} onChange={v => up('overlay.gradient.size', v)} fmt={pct} />
          <ColorF label="色" value={(d.overlay.gradient || {}).color || '#000000'} onChange={v => up('overlay.gradient.color', v)} />
        </>)}
        {d.overlay.type === 'band' && (<>
          <Sel label="向き" value={d.overlay.band.dir} opts={[['h', '横の帯'], ['v', '縦の帯']]} onChange={v => up('overlay.band.dir', v)} />
          <Sl label="不透明度" value={d.overlay.band.opacity} min={0.1} max={1} step={0.01} onChange={v => up('overlay.band.opacity', v)} fmt={pct} />
          <Sl label="太さ" value={d.overlay.band.size} min={0.08} max={0.8} step={0.01} onChange={v => up('overlay.band.size', v)} fmt={pct} />
          <Sl label="位置" value={d.overlay.band.pos} min={0.1} max={0.9} step={0.01} onChange={v => up('overlay.band.pos', v)} fmt={pct} />
          <ColorF label="色" value={d.overlay.band.color} onChange={v => up('overlay.band.color', v)} />
        </>)}
      </Acc>
      <Acc title="▭ 枠線">
        <label className="text-xs text-slate-600 flex items-center gap-2"><input type="checkbox" checked={!!d.frame.on} onChange={e => up('frame.on', e.target.checked)} />枠線を入れる</label>
        {d.frame.on && (<><Sl label="太さ" value={d.frame.width} min={1} max={14} step={1} onChange={v => up('frame.width', v)} /><Sl label="内側の余白" value={d.frame.inset} min={0} max={90} step={1} onChange={v => up('frame.inset', v)} /><ColorF label="色" value={d.frame.color} onChange={v => up('frame.color', v)} /></>)}
      </Acc>
      {n > 1 && <Sl label="写真のすき間" value={d.gap || 0} min={0} max={24} step={2} onChange={v => up('gap', v)} />}
    </>)}
  </div>);
}

// ============ CreateTab ============
function CreateTab({ user, accounts, categories, projects, selectedProject, showToast, openGallery, schedules, editImg, mode = 'create', onSaved, designTemplates = [], onSaveTemplate, onDeleteTemplate }) {
  const canvasRef = useRef(null);
  const isRegister = mode === 'register';
  const [saved, setSaved] = useState(null);      // 保存完了画面
  const [flashKey, setFlashKey] = useState(0);   // 写真投入時のプレビュー点滅
  const secPhoto = useRef(null), secFolder = useRef(null), secSize = useRef(null);
  const scrollTo = (r) => { try { r.current && r.current.scrollIntoView({ behavior: 'smooth', block: 'start' }); } catch (e) {} };
  // デザイン設定（写真データは photoSrcs に分けて持つ：スライダー操作のたびに巨大な dataURL をコピーしないため）
  const [design, setDesign] = useState(() => {
    try { const last = JSON.parse(localStorage.getItem('thumb_design_last') || 'null'); if (last && last.template) { const d = TD.merge(TD.DEFAULT, last); d.photos = Array.from({ length: TD.cellCount(d.template) }, () => ({ zoom: 1, dx: 0, dy: 0 })); return d; } } catch (e) {}
    const d = JSON.parse(JSON.stringify(TD.DEFAULT)); d.photos = [{ zoom: 1, dx: 0, dy: 0 }]; return d;
  });
  const [photoSrcs, setPhotoSrcs] = useState([]);
  const [selectedCell, setSelectedCell] = useState(0);
  useEffect(() => {
    if (isRegister) setDesign(prev => prev.template === 'none' ? prev : TD.applyPreset(prev, 'none'));
    else if (!editImg) setDesign(prev => prev.template === 'none' ? TD.applyPreset(prev, 'single') : prev);
  }, [mode]);
  const imgCacheRef = useRef({});
  const dragRef = useRef(null);
  const baseImage = photoSrcs.some(Boolean) ? 'y' : null;
  const [canvasWidth, setCanvasWidth] = useState(1200);
  const [canvasHeight, setCanvasHeight] = useState(900);

  const [accountId, setAccountId] = useState('');
  const [categoryId, setCategoryId] = useState('');
  const [dateISO, setDateISO] = useState(todayISO());
  const [memo, setMemo] = useState('');
  const [isUploading, setIsUploading] = useState(false);
  const [dragOver, setDragOver] = useState(false);
  const [schedId, setSchedId] = useState(()=>{        // 紐付ける投稿予定（?sched=IDで統合ツールから指定可）
    try{ return new URLSearchParams(location.search).get('sched') || ''; }catch(e){ return ''; }
  });
  const [dlOnShare, setDlOnShare] = useState(false); // 保存と同時にPCへDL
  const selSched = (schedules||[]).find(x => x.id === schedId) || null;
  // 予定を選んだら日付を自動セット
  useEffect(() => { if (selSched && selSched.date) setDateISO(selSched.date); }, [schedId]);

  // プロジェクト選択中は自動適用
  useEffect(() => {
    if (selectedProject) { setAccountId(selectedProject.accountId); setCategoryId(selectedProject.categoryId); }
  }, [selectedProject]);

  const accountLocked = !!selectedProject;
  const account = accounts.find(a => a.id === accountId);
  const category = categories.find(c => c.id === categoryId);
  const catsForAcc = categories.filter(c => c.accountId === accountId);
  useEffect(() => {
    if (!accountLocked && !catsForAcc.find(c => c.id === categoryId)) setCategoryId('');
  }, [accountId, categories]);

  const mmdd = isoToMMDD(dateISO);
  const folderName = buildFolderName({
    accountName: account?.name || '', categoryName: category?.name || '', date: mmdd, memo
  });

  // 写真の投入：選択中のセルから順に入れる（4枚コラージュはまとめて選べる）。長辺1600pxに縮小して持つ
  const readFiles = (files, startCell) => {
    const list = (files || []).filter(f => f && f.type && f.type.startsWith('image/'));
    if (!list.length) { showToast('画像ファイルを選んでください'); return; }
    list.forEach((f, k) => {
      const r = new FileReader();
      r.onload = async (ev) => {
        let src = ev.target.result;
        try { src = await compressDataUrl(src, 1600, 0.88); } catch (e) {}
        const n = TD.cellCount(design.template);
        const idx = ((startCell || 0) + k) % n;
        setPhotoSrcs(prev => { const a = prev.slice(); a[idx] = src; return a; });
        setDesign(prev => { const o = { ...prev, photos: (prev.photos || []).slice() }; while (o.photos.length < n) o.photos.push({ zoom: 1, dx: 0, dy: 0 }); o.photos[idx] = { zoom: 1, dx: 0, dy: 0 }; return o; });
        setFlashKey(k => k + 1);
        if (k === list.length - 1) showToast(list.length > 1 ? `写真を${list.length}枚入れました` : '写真を入れました');
      };
      r.readAsDataURL(f);
    });
  };
  const removePhoto = (i) => setPhotoSrcs(prev => { const a = prev.slice(); a[i] = ''; return a; });
  const onDrop = (e) => {
    e.preventDefault(); setDragOver(false);
    readFiles(Array.from(e.dataTransfer.files || []), selectedCell);
  };
  // プレビュー上のドラッグで写真の位置合わせ
  const canvasPos = (e) => { const c = canvasRef.current; const r = c.getBoundingClientRect(); return { x: (e.clientX - r.left) * c.width / r.width, y: (e.clientY - r.top) * c.height / r.height }; };
  const onPointerDown = (e) => {
    if (!photoSrcs.some(Boolean)) return;
    const pos = canvasPos(e);
    const i = TD.cellAt(design.template, canvasWidth, canvasHeight, (design.gap || 0) * canvasWidth / TD.BASE_W, pos.x, pos.y);
    setSelectedCell(i);
    if (!photoSrcs[i]) return;
    const p = (design.photos || [])[i] || {};
    dragRef.current = { i, sx: pos.x, sy: pos.y, dx: p.dx || 0, dy: p.dy || 0 };
    try { e.currentTarget.setPointerCapture(e.pointerId); } catch (err) {}
  };
  const onPointerMove = (e) => {
    const g = dragRef.current; if (!g) return;
    const pos = canvasPos(e); const s = canvasWidth / TD.BASE_W;
    const ndx = g.dx + (pos.x - g.sx) / s, ndy = g.dy + (pos.y - g.sy) / s;
    setDesign(prev => { const o = { ...prev, photos: (prev.photos || []).slice() }; o.photos[g.i] = { ...(o.photos[g.i] || {}), dx: ndx, dy: ndy }; return o; });
  };
  const onPointerUp = () => { dragRef.current = null; };
  // 動作確認用フック（写真をコードから差し込む）
  useEffect(() => { window.__thumbSetPhotos = (arr) => { setPhotoSrcs(arr); setDesign(prev => ({ ...prev, photos: arr.map((_, i) => (prev.photos || [])[i] || { zoom: 1, dx: 0, dy: 0 }) })); }; window.__thumbSetDesign = (patch) => setDesign(prev => TD.merge(prev, patch)); return () => { delete window.__thumbSetPhotos; delete window.__thumbSetDesign; }; }, []);
  // 最後に使ったデザインを次回の初期値に
  useEffect(() => { try { localStorage.setItem('thumb_design_last', JSON.stringify(TD.strip(design))); } catch (e) {} }, [design]);
  // ギャラリーの「編集」から開いたとき：デザインと元写真を復元
  useEffect(() => {
    if (!editImg) return;
    (async () => {
      try {
        const d = TD.merge(TD.DEFAULT, editImg.design || {});
        const n = TD.cellCount(d.template);
        d.photos = Array.from({ length: n }, (_, i) => (editImg.design && editImg.design.photos && editImg.design.photos[i]) || { zoom: 1, dx: 0, dy: 0 });
        const srcs = [];
        for (const id of (editImg.sourceIds || [])) {
          if (!id) { srcs.push(''); continue; }
          const sd = await getDoc(docRefFn('thumb_sources', id)); srcs.push(sd.exists() ? (sd.data().dataUrl || '') : '');
        }
        if (!srcs.some(Boolean) && editImg.imageUrl) srcs[0] = editImg.imageUrl; // 元写真が無いときは完成画像を下地に
        setDesign(d); setPhotoSrcs(srcs); setSelectedCell(0);
        if (editImg.width) setCanvasWidth(editImg.width); if (editImg.height) setCanvasHeight(editImg.height);
        if (!accountLocked) { setAccountId(editImg.accountId || ''); setCategoryId(editImg.categoryId || ''); }
        setMemo(editImg.memo || '');
        showToast('デザインを読み込みました');
      } catch (e) { console.error(e); showToast('読み込みに失敗しました'); }
    })();
  }, [editImg]);

  // Canvas描画（写真 → 透かし → 枠 → 文字。design-engine.js）
  useEffect(() => {
    const canvas = canvasRef.current;
    if (!canvas) return;
    let alive = true;
    const full = { ...design, photos: Array.from({ length: TD.cellCount(design.template) }, (_, i) => ({ ...((design.photos || [])[i] || {}), src: photoSrcs[i] || '' })) };
    const draw = () => { if (!alive) return; TD.render(canvas.getContext('2d'), full, canvasWidth, canvasHeight, imgCacheRef.current); };
    const missing = full.photos.filter(p => p.src && !imgCacheRef.current[p.src]);
    const pImgs = missing.length ? TD.loadImages({ photos: missing }).then(c => Object.assign(imgCacheRef.current, c)) : Promise.resolve();
    draw();
    Promise.all([pImgs, TD.ensureFonts(full)]).then(draw);
    return () => { alive = false; };
  }, [design, photoSrcs, canvasWidth, canvasHeight]);

  const canSave = !!baseImage && !!accountId && !!categoryId;
  const missing = [!baseImage && '写真', !accountId && 'アカウント', !categoryId && 'カテゴリ'].filter(Boolean);
  const steps = [
    { key: 'photo', label: isRegister ? '写真を選ぶ' : '写真を選ぶ', done: !!baseImage, ref: secPhoto, req: true },
    ...(isRegister ? [] : [{ key: 'design', label: 'デザインを整える', done: !!baseImage && design.template !== 'none', ref: secPhoto, req: false }]),
    { key: 'folder', label: '保存先を選ぶ', done: !!accountId && !!categoryId, ref: secFolder, req: true },
    { key: 'save', label: '保存する', done: !!saved, ref: null, req: true },
  ];

  const handleDownload = () => {
    if (!canSave) { showToast('画像とアカウント・カテゴリを設定してください'); return; }
    const c = canvasRef.current; if (!c) return;
    // ★同期処理のみ（await禁止）：iOS Safariはタップ直後でないと保存できないため
    const url = compressCanvasSync(c, liveCompress);
    const link = document.createElement('a');
    link.download = `${folderName}.jpg`;
    link.rel = 'noopener';
    link.href = url; link.click();
    showToast(`保存しました（${dataUrlKb(url)}KB・軽量JPG）`);
  };
  const handleShare = async () => {
    if (!canSave) { showToast('画像とアカウント・カテゴリを設定してください'); return; }
    if (!user || !db) { showToast('データベースに接続できません'); return; }
    const c = canvasRef.current; if (!c) return;
    const url = compressCanvasSync(c, liveCompress);
    // 同時DLはタップ直後の同期処理で（iOS Safari対策）
    if (dlOnShare) {
      const link = document.createElement('a');
      link.download = `${folderName}.jpg`; link.rel = 'noopener'; link.href = url; link.click();
    }
    setIsUploading(true);
    try {
      const linkTitle = selSched ? (selSched.catchTitle || selSched.title || '') : '';
      // デザインありのときは、あとで「編集」できるよう元写真（長辺900px）と設定も残す
      const sourceIds = [];
      if (design.template !== 'none') {
        for (let i = 0; i < TD.cellCount(design.template); i++) {
          const src = photoSrcs[i]; if (!src) { sourceIds.push(''); continue; }
          const small = await compressDataUrl(src, 900, 0.75);
          const sref = await addDoc(colRef('thumb_sources'), { dataUrl: small, createdAt: Date.now(), authorId: user.uid });
          sourceIds.push(sref.id);
        }
      }
      const ref = await addDoc(colRef('shared_thumbnails'), {
        imageUrl: url, titleText: (design.template !== 'none' ? (design.title.text || '').replace(/[{}]/g, '').replace(/\n/g, ' ') : ''), folderName,
        design: design.template !== 'none' ? TD.strip(design) : null, sourceIds,
        accountId, accountName: account?.name || '',
        categoryId, categoryName: category?.name || '',
        date: mmdd, memo,
        projectId: selectedProject?.id || null,
        authorId: user.uid, createdAt: Date.now(),
        width: canvasWidth, height: canvasHeight,
        linkedScheduleId: schedId || '', linkedScheduleTitle: linkTitle,
      });
      // 予定側にも画像タイトルを書き戻し（双方向紐付け）。旧画像のリンクは先にクリア
      if (schedId) {
        if (selSched && selSched.imageId) {
          await updateDoc(docRefFn('shared_thumbnails', selSched.imageId), { linkedScheduleId: '', linkedScheduleTitle: '' }).catch(()=>{});
        }
        await setDoc(docRefFn('studio_schedule', schedId), { imageTitle: `${folderName}.jpg`, imageId: ref.id }, { merge: true });
      }
      showToast(schedId ? '保存＆予定と紐付けました' : 'チームギャラリーに保存しました');
      sendGalleryNotify({ accountId, accountName: account?.name || '', categoryName: category?.name || '', folderName });
      setSaved({ id: ref.id, name: `${folderName}.jpg`, kb: dataUrlKb(url), sched: schedId ? { id: schedId, title: linkTitle } : null });
      if (onSaved) onSaved(ref.id);
      setSchedId('');
    } catch (e) {
      console.error(e);
      showToast('保存に失敗しました。画像が大きすぎる可能性があります。');
    } finally { setIsUploading(false); }
  };

  return (
    <main className="flex-1 overflow-y-auto md:overflow-hidden flex flex-col md:flex-row relative">
      <div className="w-full md:w-[400px] bg-white border-r border-slate-200 md:overflow-y-auto shrink-0">
        <div className="p-6 space-y-6">
          {selectedProject && (
            <div className="bg-blue-50 border border-blue-200 rounded-lg p-3 text-xs text-blue-900">
              <div className="font-medium">📁 プロジェクト適用中</div>
              <div className="mt-1">「{selectedProject.name}」のアカウント・カテゴリが自動入力されます</div>
            </div>
          )}

          {/* やることリスト */}
          <div className="bg-gradient-to-br from-[#EAF3F4] to-white border border-[#CBDFE4] rounded-xl p-3 fade-up">
            <div className="text-xs font-bold text-[#24505E] mb-1.5">やること</div>
            <ol className="space-y-1">
              {steps.map((st, i) => (
                <li key={st.key}>
                  <button type="button" onClick={() => st.ref && scrollTo(st.ref)} className={`w-full flex items-center gap-2 text-left text-sm rounded-lg px-2 py-1 ${st.done ? 'text-slate-400' : 'text-slate-800 hover:bg-white'}`}>
                    <span className={`w-5 h-5 rounded-full flex items-center justify-center text-[11px] font-bold shrink-0 ${st.done ? 'bg-emerald-500 text-white pop' : 'bg-white border-2 border-[#2F6D80] text-[#2F6D80]'}`}>{st.done ? '✓' : i + 1}</span>
                    <span className={st.done ? 'line-through' : ''}>{st.label}</span>
                    {!st.done && (st.req ? <span className="req">必須</span> : <span className="text-[10px] text-slate-400">任意</span>)}
                  </button>
                </li>
              ))}
            </ol>
          </div>

          <section className="space-y-3" ref={secPhoto}>
            <div className="flex items-center space-x-2 border-b pb-2">
              <ImageIcon className="w-5 h-5 text-blue-600" />
              <h2 className="text-base font-semibold">1. {isRegister ? '写真を選ぶ' : '写真とデザイン'}</h2>
              {baseImage ? <span className="ok-badge">OK</span> : <span className="req">必須</span>}
            </div>
            {isRegister ? (
              <div onDragOver={(e) => { e.preventDefault(); setDragOver(true); }} onDragLeave={() => setDragOver(false)} onDrop={onDrop}>
                <label className={`flex flex-col items-center justify-center w-full h-44 border-2 border-dashed rounded-xl cursor-pointer transition-colors ${dragOver ? 'border-blue-500 bg-blue-50' : baseImage ? 'border-emerald-300 bg-emerald-50/40' : 'border-slate-300 bg-slate-50 hover:bg-slate-100'}`}>
                  {baseImage ? (<>
                    <img src={photoSrcs[0]} alt="" className="max-h-32 max-w-full object-contain rounded shadow" />
                    <p className="text-xs text-slate-500 mt-1.5">タップで差し替え</p>
                  </>) : (<>
                    <Upload className={`w-9 h-9 mb-2 ${dragOver ? 'text-blue-500' : 'text-slate-400'}`} />
                    <p className="text-sm font-medium text-slate-700">{dragOver ? 'ここにドロップ' : 'タップして写真を選ぶ'}</p>
                    <p className="text-xs text-slate-400 mt-1">PNG / JPG / WEBP　編集せずそのまま保存します</p>
                  </>)}
                  <input type="file" className="hidden" accept="image/*" onChange={(e) => { readFiles(Array.from(e.target.files || []), 0); e.target.value = ''; }} />
                </label>
                {baseImage && <button onClick={() => removePhoto(0)} className="mt-2 text-xs text-slate-500 hover:text-red-500 underline">写真を外す</button>}
              </div>
            ) : (
              <div onDragOver={(e) => { e.preventDefault(); setDragOver(true); }} onDragLeave={() => setDragOver(false)} onDrop={onDrop} className={dragOver ? 'dnd-hi rounded-xl p-1' : ''}>
                <DesignPanel design={design} setDesign={setDesign} selectedCell={selectedCell} setSelectedCell={setSelectedCell} onPickFiles={readFiles} photoSrcs={photoSrcs} onRemovePhoto={removePhoto} templates={designTemplates} onSaveTemplate={onSaveTemplate} onDeleteTemplate={onDeleteTemplate} showToast={showToast} />
              </div>
            )}
          </section>

          <section className="space-y-3" ref={secFolder}>
            <div className="flex items-center space-x-2 border-b pb-2">
              <Folder className="w-5 h-5 text-blue-600" />
              <h2 className="text-base font-semibold">2. 保存先とファイル名</h2>
              {(accountId && categoryId) ? <span className="ok-badge">OK</span> : <span className="req">必須</span>}
            </div>
            <div className="space-y-2">
              <label className="text-xs font-medium text-slate-500">📅 投稿予定と紐付け（任意）</label>
              <select value={schedId} onChange={(e) => setSchedId(e.target.value)} className="w-full p-2 border rounded text-sm">
                <option value="">紐付けない（あとで統合ツールから選択も可）</option>
                {selectableScheds(schedules).map(x => (
                  <option key={x.id} value={x.id}>{schedOptionLabel(x)}</option>
                ))}
              </select>
              {selSched && (
                <div className="bg-emerald-50 border border-emerald-200 rounded p-2.5 text-xs text-emerald-900 space-y-1.5">
                  <div>✅ 保存すると<b>この予定に自動で紐付け</b>られます（状態：{schedStatusLabel(selSched)}）{selSched.imageTitle ? <span className="text-amber-700"><br/>⚠️ 既に「{selSched.imageTitle}」が紐付いています（上書きされます）</span> : null}</div>
                  <label className="flex items-center gap-2 font-medium">
                    <input type="checkbox" checked={dlOnShare} onChange={(e)=>setDlOnShare(e.target.checked)} className="w-4 h-4" />
                    保存と同時にPCへダウンロード（タイトル名）
                  </label>
                </div>
              )}
            </div>
            <div className="space-y-2">
              <label className="text-xs font-medium text-slate-500">運用アカウント{accountId ? <span className="ok-badge">OK</span> : <span className="req">必須</span>}</label>
              <select value={accountId} onChange={(e) => setAccountId(e.target.value)} disabled={accountLocked} className="w-full p-2 border rounded text-sm disabled:bg-slate-100">
                <option value="">選択してください</option>
                {accounts.map(a => <option key={a.id} value={a.id}>{a.name}</option>)}
              </select>
            </div>
            <div className="space-y-2">
              <label className="text-xs font-medium text-slate-500">画像カテゴリ{categoryId ? <span className="ok-badge">OK</span> : <span className="req">必須</span>}</label>
              <select value={categoryId} onChange={(e) => setCategoryId(e.target.value)} disabled={accountLocked || !accountId} className="w-full p-2 border rounded text-sm disabled:bg-slate-100">
                <option value="">選択してください</option>
                {catsForAcc.map(c => <option key={c.id} value={c.id}>{c.name}</option>)}
              </select>
            </div>
            <div className="space-y-2">
              <label className="text-xs font-medium text-slate-500">日付</label>
              <input type="date" value={dateISO} onChange={(e) => setDateISO(e.target.value)} className="w-full p-2 border rounded text-sm" />
            </div>
            <div className="space-y-2">
              <label className="text-xs font-medium text-slate-500">任意テキスト（原則不要）</label>
              <input value={memo} onChange={(e) => setMemo(e.target.value)} placeholder="通常は空欄のまま（特別な区別が必要な時だけ）" className="w-full p-2 border rounded text-sm" />
            </div>
            <div className="bg-slate-50 border border-slate-200 rounded p-3 text-xs">
              <div className="text-slate-500 mb-1">プレビュー</div>
              <div className="font-mono break-all text-slate-800">{folderName}</div>
              <button onClick={async () => { const n = `${folderName}.jpg`; await copyToClipboard(n); showToast(`「${n}」をコピーしました`); }} className="mt-2 w-full bg-blue-50 text-blue-700 hover:bg-blue-100 py-2 rounded font-medium flex items-center justify-center gap-1.5"><Copy className="w-3.5 h-3.5" />タイトル.jpg をコピー（投稿ツール用）</button>
            </div>
          </section>

          <section className="space-y-3 pb-6 safe-b" ref={secSize}>
            <div className="flex items-center space-x-2 border-b pb-2">
              <Settings className="w-5 h-5 text-blue-600" />
              <h2 className="text-base font-semibold">3. 画像サイズ</h2>
              <span className="text-[10px] text-slate-400">任意（通常はこのまま）</span>
            </div>
            <div className="flex items-center gap-3">
              <div className="flex-1">
                <label className="block text-xs font-medium text-slate-500 mb-1">幅</label>
                <input type="number" value={canvasWidth} onChange={(e) => setCanvasWidth(Number(e.target.value))} className="w-full p-2 border rounded text-sm" />
              </div>
              <div className="text-slate-400 mt-4">×</div>
              <div className="flex-1">
                <label className="block text-xs font-medium text-slate-500 mb-1">高さ</label>
                <input type="number" value={canvasHeight} onChange={(e) => setCanvasHeight(Number(e.target.value))} className="w-full p-2 border rounded text-sm" />
              </div>
            </div>
            <div className="flex gap-2">
              <button onClick={() => { setCanvasWidth(1200); setCanvasHeight(900); }} className="text-xs bg-slate-100 hover:bg-slate-200 px-3 py-1.5 rounded font-medium">1200×900</button>
              <button onClick={() => { setCanvasWidth(1080); setCanvasHeight(1080); }} className="text-xs bg-slate-100 hover:bg-slate-200 px-3 py-1.5 rounded font-medium">1080×1080</button>
            </div>
          </section>
        </div>
      </div>

      <div className="flex-none md:flex-1 h-[46vh] md:h-auto min-h-0 bg-[#E4EDF0] md:bg-slate-200/50 p-3 md:p-6 flex flex-col overflow-hidden md:overflow-auto order-first md:order-none sticky md:static top-0 z-20 md:z-auto shadow-md md:shadow-none">
        <div className="flex flex-wrap items-center justify-between gap-2 mb-2 md:mb-4">
          <div className="text-[11px] md:text-xs text-slate-600 min-w-0">
            {canSave ? <span className="text-emerald-700 font-medium fade-up">✅ 保存できます</span> : <span>あと：<b className="text-[#B25B44]">{missing.join('・')}</b></span>}
          </div>
          <div className="flex items-center gap-2">
            <button onClick={handleShare} disabled={isUploading || !canSave} title={canSave ? '' : `先に ${missing.join('・')} を設定してください`} className={`flex items-center gap-2 bg-indigo-600 hover:bg-indigo-700 disabled:bg-slate-300 disabled:cursor-not-allowed text-white px-3 md:px-4 py-2 rounded-lg font-medium text-sm shadow ${canSave && !isUploading ? 'glow' : ''}`}>
              {isUploading ? <Loader2 className="w-4 h-4 animate-spin" /> : <Share2 className="w-4 h-4" />}{isUploading ? '保存中…' : 'ギャラリーに保存'}
            </button>
            <button onClick={handleDownload} disabled={!canSave} className="flex items-center gap-2 bg-blue-600 hover:bg-blue-700 disabled:bg-slate-300 disabled:cursor-not-allowed text-white px-3 md:px-4 py-2 rounded-lg font-medium text-sm shadow">
              <Download className="w-4 h-4" /><span className="hidden sm:inline">PCに保存</span><span className="sm:hidden">DL</span>
            </button>
          </div>
        </div>
        {saved && (
          <div className="fixed inset-0 z-[60] bg-slate-900/50 backdrop-blur-sm flex items-center justify-center p-4" onClick={() => setSaved(null)}>
            <div className="bg-white rounded-2xl shadow-2xl p-5 w-full max-w-sm text-center fade-up" onClick={(e) => e.stopPropagation()}>
              <svg viewBox="0 0 64 64" className="w-16 h-16 mx-auto pop"><circle cx="32" cy="32" r="30" fill="#EDF6F0" /><path d="M18 33 L28 43 L46 23" fill="none" stroke="#3E8E7E" strokeWidth="5" strokeLinecap="round" strokeLinejoin="round" className="check-path" /></svg>
              <div className="text-base font-bold text-slate-800 mt-2">保存しました</div>
              <div className="text-xs text-slate-500 mt-1 break-all">{saved.name}（{saved.kb}KB）</div>
              {saved.sched && <div className="text-xs text-emerald-700 mt-1">📅「{saved.sched.title}」と紐付けました</div>}
              <div className="grid grid-cols-1 gap-2 mt-4">
                {saved.sched && <a href={`/studio?sched=${saved.sched.id}`} target="_blank" rel="noopener" className="bg-emerald-600 hover:bg-emerald-700 text-white px-3 py-2.5 rounded-xl text-sm font-medium">✍️ 投稿文の作成へ</a>}
                <button onClick={() => { setSaved(null); openGallery(); }} className="bg-blue-600 hover:bg-blue-700 text-white px-3 py-2.5 rounded-xl text-sm font-medium">ギャラリーで確認する</button>
                <button onClick={() => { setSaved(null); setPhotoSrcs([]); setSelectedCell(0); }} className="border border-slate-300 text-slate-700 hover:bg-slate-50 px-3 py-2.5 rounded-xl text-sm font-medium">続けて{isRegister ? '登録' : '作成'}する</button>
              </div>
            </div>
          </div>
        )}
        <div className="flex-1 min-h-0 flex flex-col items-center justify-center">
          <div key={flashKey} className={`relative w-full flex-1 min-h-0 flex items-center justify-center rounded-md ${flashKey ? 'flash' : ''}`}>
            <canvas ref={canvasRef} width={canvasWidth} height={canvasHeight} className="max-w-full max-h-full object-contain shadow-2xl bg-white rounded-md ring-1 ring-slate-900/5" style={{ touchAction: 'none', cursor: baseImage ? 'grab' : 'default' }} onPointerDown={onPointerDown} onPointerMove={onPointerMove} onPointerUp={onPointerUp} onPointerCancel={onPointerUp} />
          </div>
          <p className="mt-1.5 md:mt-4 text-[11px] md:text-sm text-slate-500 font-medium">{baseImage ? `書き出しサイズ: ${canvasWidth} × ${canvasHeight} px${isRegister ? '' : '　※プレビューをドラッグで位置合わせ'}` : '👈 まず写真を選んでください'}</p>
        </div>
      </div>
    </main>
  );
}

// ============ GalleryModal ============
function GalleryModal({ onClose, images, accounts, categories, showToast, schedules, onEdit, page, onCreate, onRegister, highlightId, loading }) {
  const [filterMode, setFilterMode] = useState('all'); // all|account|category|both
  const [filterAccountId, setFilterAccountId] = useState('');
  const [filterCategoryId, setFilterCategoryId] = useState('');
  const [searchText, setSearchText] = useState('');
  const [searchMode, setSearchMode] = useState('AND'); // AND|OR
  const [editing, setEditing] = useState(null); // 分類変更モーダル用
  const [confirm, setConfirm] = useState(null);
  const [linkImg, setLinkImg] = useState(null);      // 予定紐付けモーダル用
  const [linkSchedId, setLinkSchedId] = useState('');
  const [filtersOpen, setFiltersOpen] = useState(false);
  const doLinkImage = async () => {
    if (!linkSchedId) { showToast('予定を選んでください'); return; }
    const sched = (schedules||[]).find(x => x.id === linkSchedId); if (!sched || !linkImg) return;
    const name = `${safeNameStr(linkImg.folderName || linkImg.titleText || 'image')}.jpg`;
    try {
      // 予定に既に別画像が付いていたら、その画像側のリンクを先にクリア（stale防止）
      if (sched.imageId && sched.imageId !== linkImg.id) {
        await updateDoc(docRefFn('shared_thumbnails', sched.imageId), { linkedScheduleId: '', linkedScheduleTitle: '' }).catch(()=>{});
      }
      await updateDoc(docRefFn('shared_thumbnails', linkImg.id), { linkedScheduleId: linkSchedId, linkedScheduleTitle: sched.catchTitle || sched.title || '' });
      await setDoc(docRefFn('studio_schedule', linkSchedId), { imageTitle: name, imageId: linkImg.id }, { merge: true });
      showToast('📅 予定と紐付けました');
      setLinkImg(null);
    } catch (e) { console.error(e); showToast('紐付けに失敗しました'); }
  };
  const doUnlinkImage = async () => {
    if (!linkImg) return;
    try {
      const prevSched = linkImg.linkedScheduleId;
      await updateDoc(docRefFn('shared_thumbnails', linkImg.id), { linkedScheduleId: '', linkedScheduleTitle: '' });
      // 予定側は「本当にこの画像を使っている」場合だけクリア（別画像の予定を巻き込まない）
      if (prevSched) {
        const sc = (schedules||[]).find(x => x.id === prevSched);
        if (sc && sc.imageId === linkImg.id) {
          await setDoc(docRefFn('studio_schedule', prevSched), { imageTitle: '', imageId: '' }, { merge: true });
        }
      }
      showToast('紐付けを解除しました');
      setLinkImg(null);
    } catch (e) { console.error(e); showToast('解除に失敗しました'); }
  };
  const [sidebarOpen, setSidebarOpen] = useState(() => { try { return window.innerWidth >= 768; } catch (e) { return true; } }); // スマホは分類サイドバーを畳んで一覧を広く
  const [expandedAcc, setExpandedAcc] = useState({});

  // フィルタ
  const filtered = useMemo(() => {
    let list = images;
    if (filterMode === 'account' && filterAccountId) list = list.filter(i => i.accountId === filterAccountId);
    else if (filterMode === 'category' && filterCategoryId) list = list.filter(i => i.categoryId === filterCategoryId);
    else if (filterMode === 'both') {
      if (filterAccountId) list = list.filter(i => i.accountId === filterAccountId);
      if (filterCategoryId) list = list.filter(i => i.categoryId === filterCategoryId);
    }
    const kw = searchText.trim().split(/\s+/).filter(Boolean);
    if (kw.length) {
      list = list.filter(i => {
        const hay = [i.folderName, i.titleText, i.accountName, i.categoryName, i.memo].filter(Boolean).join(' ').toLowerCase();
        return searchMode === 'AND' ? kw.every(k => hay.includes(k.toLowerCase())) : kw.some(k => hay.includes(k.toLowerCase()));
      });
    }
    return list;
  }, [images, filterMode, filterAccountId, filterCategoryId, searchText, searchMode]);

  // アカウント別 矢印切替
  const cycleAccount = (dir) => {
    const ids = accounts.map(a => a.id);
    if (!ids.length) return;
    const cur = ids.indexOf(filterAccountId);
    const next = (cur + dir + ids.length) % ids.length;
    setFilterAccountId(ids[next]);
  };
  const cycleCategory = (dir) => {
    const list = (filterMode === 'both' && filterAccountId) ? categories.filter(c => c.accountId === filterAccountId) : categories;
    const ids = list.map(c => c.id);
    if (!ids.length) return;
    const cur = ids.indexOf(filterCategoryId);
    const next = (cur + dir + ids.length) % ids.length;
    setFilterCategoryId(ids[next]);
  };

  const catsForFilter = (filterMode === 'both' && filterAccountId) ? categories.filter(c => c.accountId === filterAccountId) : categories;

  const handleCopyLink = async (id) => {
    const base = location.origin + location.pathname;
    await copyToClipboard(`${base}?id=${id}`);
    showToast('リンクをコピーしました');
  };
  const handleDelete = (img) => {
    setConfirm({
      title: '画像を削除しますか？', body: '元に戻せません。',
      onConfirm: async () => {
        // この画像を使っている予定があれば紐付けを解除（孤立防止）
        if (img.linkedScheduleId) {
          const sc = (schedules||[]).find(x => x.id === img.linkedScheduleId);
          if (sc && sc.imageId === img.id) {
            await setDoc(docRefFn('studio_schedule', img.linkedScheduleId), { imageTitle: '', imageId: '' }, { merge: true }).catch(()=>{});
          }
        }
        await deleteDoc(docRefFn('shared_thumbnails', img.id));
        showToast('削除しました');
        setConfirm(null);
      },
      onCancel: () => setConfirm(null),
    });
  };

  // DnD
  const [draggingId, setDraggingId] = useState(null);
  const onDragStart = (e, id) => { setDraggingId(id); e.dataTransfer.effectAllowed = 'move'; };
  const onDragEnd = () => setDraggingId(null);
  const moveImage = async (img, newAccountId, newCategoryId) => {
    const a = accounts.find(x => x.id === newAccountId);
    const c = newCategoryId ? categories.find(x => x.id === newCategoryId) : null;
    const newFolder = buildFolderName({
      accountName: a?.name || '', categoryName: c?.name || '',
      date: img.date || '', memo: img.memo || ''
    });
    await updateDoc(docRefFn('shared_thumbnails', img.id), {
      accountId: newAccountId, accountName: a?.name || '',
      categoryId: newCategoryId || null, categoryName: c?.name || '',
      folderName: newFolder,
    });
    showToast('分類を変更しました');
  };
  const dropToAccount = async (accId) => {
    if (!draggingId) return;
    const img = images.find(i => i.id === draggingId);
    if (img) await moveImage(img, accId, null);
    setDraggingId(null);
  };
  const dropToCategory = async (cat) => {
    if (!draggingId) return;
    const img = images.find(i => i.id === draggingId);
    if (img) await moveImage(img, cat.accountId, cat.id);
    setDraggingId(null);
  };

  return (
    <div className={page ? 'flex-1 min-h-0 flex flex-col p-0 md:p-4' : 'fixed inset-0 bg-slate-900/70 backdrop-blur-sm z-50 flex justify-center items-center p-2 md:p-6'}>
      <div className={page ? 'bg-white md:rounded-2xl md:shadow-xl w-full max-w-7xl mx-auto flex-1 min-h-0 flex flex-col overflow-hidden' : 'bg-white rounded-2xl shadow-2xl w-full max-w-7xl h-full max-h-[95vh] flex flex-col overflow-hidden'}>
        {page ? (
          <div className="px-3 py-2 md:px-4 md:py-2.5 border-b bg-gradient-to-r from-[#EAF3F4] to-white shrink-0 flex items-center gap-2">
            <div className="flex items-center gap-2 min-w-0 mr-auto">
              <Library className="w-5 h-5 text-blue-600 shrink-0" />
              <div className="min-w-0"><div className="text-sm font-bold text-slate-800 leading-tight">ギャラリー</div><div className="text-[10px] text-slate-500 leading-tight">{filtered.length}/{images.length}件</div></div>
            </div>
            <button onClick={() => setFiltersOpen(v => !v)} className={`btn-press text-xs px-2.5 py-2 rounded-lg border ${filtersOpen || searchText || filterMode !== 'all' ? 'border-[#2F6D80] bg-[#EAF3F4] text-[#24505E]' : 'border-slate-200 bg-white text-slate-600'}`} title="検索・絞り込み"><Search className="w-4 h-4 inline" /><span className="hidden md:inline ml-1">絞り込み</span></button>
            <button onClick={onRegister} className="btn-press text-xs md:text-sm font-bold bg-white hover:bg-emerald-50 text-emerald-800 border-2 border-emerald-300 rounded-lg px-2.5 md:px-3 py-1.5 md:py-2 shadow-sm" title="できあがった写真をそのまま保存（編集なし）">⬆️ 画像を登録</button>
            <button onClick={onCreate} className="btn-press text-xs md:text-sm font-bold bg-blue-600 hover:bg-blue-700 text-white rounded-lg px-2.5 md:px-3 py-1.5 md:py-2 shadow-md" title="写真に文字・デザインを入れて保存">✨ 画像を作成</button>
          </div>
        ) : (
        <div className="flex items-center justify-between p-4 border-b bg-slate-50 shrink-0">
          <div className="flex items-center space-x-3">
            <div className="bg-blue-100 p-2 rounded-xl text-blue-600"><Library className="w-5 h-5" /></div>
            <div>
              <h2 className="text-base md:text-lg font-bold text-slate-800">チームギャラリー</h2>
              <p className="text-xs text-slate-500">{filtered.length} / {images.length} 件</p>
            </div>
          </div>
          <button onClick={onClose} className="p-2 hover:bg-slate-200 rounded-full"><X className="w-5 h-5" /></button>
        </div>
        )}

        {/* フィルタ・検索（ページ表示では開閉式） */}
        {(!page || filtersOpen) && (
        <div className="p-2 md:p-3 border-b bg-white space-y-2 shrink-0 fade-up">
          <div className="flex flex-wrap gap-1">
            {[
              { k: 'all', l: '全一覧' }, { k: 'account', l: 'アカウント別' },
              { k: 'category', l: 'カテゴリ別' }, { k: 'both', l: 'アカウント×カテゴリ' }
            ].map(t => (
              <button key={t.k} onClick={() => setFilterMode(t.k)} className={`px-3 py-1.5 rounded-md text-xs font-medium ${filterMode === t.k ? 'bg-blue-600 text-white' : 'bg-slate-100 hover:bg-slate-200 text-slate-700'}`}>{t.l}</button>
            ))}
          </div>
          {filterMode === 'account' && (
            <div className="flex items-center gap-2">
              <button onClick={() => cycleAccount(-1)} className="p-1 rounded hover:bg-slate-100"><ChevronLeft className="w-4 h-4" /></button>
              <select value={filterAccountId} onChange={(e) => setFilterAccountId(e.target.value)} className="flex-1 p-2 border rounded text-sm">
                <option value="">すべて</option>
                {accounts.map(a => <option key={a.id} value={a.id}>{a.name}</option>)}
              </select>
              <button onClick={() => cycleAccount(1)} className="p-1 rounded hover:bg-slate-100"><ChevronRight className="w-4 h-4" /></button>
            </div>
          )}
          {filterMode === 'category' && (
            <div className="flex items-center gap-2">
              <button onClick={() => cycleCategory(-1)} className="p-1 rounded hover:bg-slate-100"><ChevronLeft className="w-4 h-4" /></button>
              <select value={filterCategoryId} onChange={(e) => setFilterCategoryId(e.target.value)} className="flex-1 p-2 border rounded text-sm">
                <option value="">すべて</option>
                {categories.map(c => <option key={c.id} value={c.id}>{c.name}（{accounts.find(a => a.id === c.accountId)?.name || '?'}）</option>)}
              </select>
              <button onClick={() => cycleCategory(1)} className="p-1 rounded hover:bg-slate-100"><ChevronRight className="w-4 h-4" /></button>
            </div>
          )}
          {filterMode === 'both' && (
            <div className="flex flex-col sm:flex-row gap-2">
              <select value={filterAccountId} onChange={(e) => { setFilterAccountId(e.target.value); setFilterCategoryId(''); }} className="flex-1 p-2 border rounded text-sm">
                <option value="">アカウント選択</option>
                {accounts.map(a => <option key={a.id} value={a.id}>{a.name}</option>)}
              </select>
              <select value={filterCategoryId} onChange={(e) => setFilterCategoryId(e.target.value)} disabled={!filterAccountId} className="flex-1 p-2 border rounded text-sm">
                <option value="">カテゴリ選択</option>
                {catsForFilter.map(c => <option key={c.id} value={c.id}>{c.name}</option>)}
              </select>
            </div>
          )}
          <div className="flex items-center gap-2">
            <div className="relative flex-1">
              <Search className="w-4 h-4 text-slate-400 absolute left-2 top-1/2 -translate-y-1/2" />
              <input value={searchText} onChange={(e) => setSearchText(e.target.value)} placeholder="タイトル/アカウント/カテゴリ/メモ 検索（スペース区切り）" className="w-full pl-8 pr-2 py-2 border rounded text-sm" />
            </div>
            <button onClick={() => setSearchMode(searchMode === 'AND' ? 'OR' : 'AND')} className="px-3 py-2 border rounded text-xs font-bold bg-slate-50 hover:bg-slate-100">{searchMode}</button>
          </div>
        </div>
        )}

        <div className="flex-1 flex overflow-hidden">
          {/* サイドバー */}
          <aside className={`bg-slate-50 border-r overflow-y-auto shrink-0 transition-all ${sidebarOpen ? 'w-56' : 'w-10'}`}>
            <button onClick={() => setSidebarOpen(!sidebarOpen)} className="w-full p-2 text-xs text-slate-500 hover:bg-slate-100 flex items-center justify-between">
              {sidebarOpen && <span>ドラッグで分類変更</span>}
              {sidebarOpen ? <ChevronLeft className="w-4 h-4" /> : <ChevronRight className="w-4 h-4" />}
            </button>
            {sidebarOpen && (
              <div className="p-2 space-y-1">
                {accounts.map(a => {
                  const cats = categories.filter(c => c.accountId === a.id);
                  const expanded = expandedAcc[a.id] ?? true;
                  return (
                    <div key={a.id}>
                      <div
                        onDragOver={(e) => { e.preventDefault(); e.currentTarget.classList.add('dnd-hi'); }}
                        onDragLeave={(e) => e.currentTarget.classList.remove('dnd-hi')}
                        onDrop={(e) => { e.currentTarget.classList.remove('dnd-hi'); dropToAccount(a.id); }}
                        className="flex items-center gap-1 p-1.5 rounded bg-white border border-slate-200 text-xs font-medium"
                      >
                        <button onClick={() => setExpandedAcc(prev => ({...prev, [a.id]: !expanded}))} className="p-0.5">
                          {expanded ? <ChevronDown className="w-3 h-3" /> : <ChevronRightSmall className="w-3 h-3" />}
                        </button>
                        <Users className="w-3 h-3 text-blue-500" />
                        <span className="truncate flex-1">{a.name}</span>
                      </div>
                      {expanded && cats.map(c => (
                        <div
                          key={c.id}
                          onDragOver={(e) => { e.preventDefault(); e.currentTarget.classList.add('dnd-hi'); }}
                          onDragLeave={(e) => e.currentTarget.classList.remove('dnd-hi')}
                          onDrop={(e) => { e.currentTarget.classList.remove('dnd-hi'); dropToCategory(c); }}
                          className="ml-4 flex items-center gap-1 p-1.5 rounded hover:bg-white border border-transparent text-xs"
                        >
                          <Tag className="w-3 h-3 text-slate-400" />
                          <span className="truncate">{c.name}</span>
                        </div>
                      ))}
                    </div>
                  );
                })}
              </div>
            )}
          </aside>

          {/* 一覧 */}
          <div className="flex-1 overflow-y-auto p-2 md:p-4 bg-slate-100/50 safe-b">
            {loading ? (
              <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-4">
                {Array.from({ length: 8 }).map((_, i) => <div key={i} className="bg-white rounded-xl border overflow-hidden animate-pulse"><div className="aspect-[4/3] bg-slate-200" /><div className="p-3 space-y-2"><div className="h-3 bg-slate-200 rounded w-3/4" /><div className="h-2 bg-slate-100 rounded w-1/2" /></div></div>)}
              </div>
            ) : filtered.length === 0 ? (
              <div className="h-full flex flex-col items-center justify-center text-slate-400 space-y-3 fade-up">
                <Library className="w-14 h-14 opacity-30" />
                <p className="font-medium text-slate-500">{images.length === 0 ? 'まだ画像がありません' : '該当する画像はありません'}</p>
                {images.length === 0 && page && <p className="text-xs text-slate-400">上の「✨ 画像を作成」か「⬆️ 画像を登録」から始めましょう</p>}
              </div>
            ) : (
              <div className="grid grid-cols-2 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-2 md:gap-4">
                {filtered.map(img => (
                  <div
                    key={img.id}
                    draggable
                    onDragStart={(e) => onDragStart(e, img.id)}
                    onDragEnd={onDragEnd}
                    className={`card-hover bg-white rounded-xl shadow-sm border overflow-hidden flex flex-col ${draggingId === img.id ? 'opacity-40' : ''} ${highlightId === img.id ? 'ring-4 ring-emerald-400 glow' : ''}`}
                  >
                    <div className="aspect-[4/3] bg-slate-200 relative overflow-hidden group cursor-move">
                      <img src={img.imageUrl} alt={img.folderName || img.titleText} className="w-full h-full object-cover" draggable={false} />
                      <div className="absolute inset-0 bg-slate-900/50 opacity-0 group-hover:opacity-100 transition-opacity flex items-center justify-center gap-2">
                        <button title="ダウンロード" onClick={() => { const a = document.createElement('a'); a.download = `${safeNameStr(img.folderName || img.titleText || 'image')}.jpg`; a.href = img.imageUrl; a.click(); }} className="bg-white/90 text-slate-800 hover:bg-white p-2 rounded-full shadow-lg"><Download className="w-4 h-4" /></button>
                        <button title="リンク発行" onClick={() => handleCopyLink(img.id)} className="bg-white/90 text-blue-700 hover:bg-white p-2 rounded-full shadow-lg"><Link2 className="w-4 h-4" /></button>
                        <button title="分類変更" onClick={() => setEditing(img)} className="bg-white/90 text-indigo-700 hover:bg-white p-2 rounded-full shadow-lg"><Edit3 className="w-4 h-4" /></button>
                        <button title="削除" onClick={() => handleDelete(img)} className="bg-white/90 text-red-600 hover:bg-red-50 p-2 rounded-full shadow-lg"><Trash2 className="w-4 h-4" /></button>
                      </div>
                    </div>
                    <div className="p-3">
                      <p className="text-xs font-bold text-slate-800 line-clamp-2 leading-snug mb-1 break-all">{img.folderName || img.titleText || '（未分類）'}</p>
                      {img.linkedScheduleTitle ? <p className="text-[10px] text-blue-700 mb-1 truncate">📅 {img.linkedScheduleTitle}</p> : null}
                      <div className="flex items-center justify-between gap-1">
                        <p className="text-[10px] text-slate-400">{fmtDateTime(img.createdAt)}</p>
                        <div className="flex items-center gap-1 shrink-0">
                          {img.design && onEdit ? <button onClick={() => onEdit(img)} className="text-[10px] bg-amber-50 text-amber-700 hover:bg-amber-100 px-2 py-1 rounded">✏️ 編集</button> : null}
                          <button onClick={() => { setLinkImg(img); setLinkSchedId(img.linkedScheduleId || ''); }} className="text-[10px] bg-emerald-50 text-emerald-700 hover:bg-emerald-100 px-2 py-1 rounded flex items-center gap-1">📅紐付け</button>
                          <button onClick={async () => { const n = `${safeNameStr(img.folderName || img.titleText || 'image')}.jpg`; await copyToClipboard(n); showToast(`「${n}」をコピーしました`); }} className="text-[10px] bg-blue-50 text-blue-700 hover:bg-blue-100 px-2 py-1 rounded flex items-center gap-1"><Copy className="w-3 h-3" />.jpg</button>
                        </div>
                      </div>
                    </div>
                  </div>
                ))}
              </div>
            )}
          </div>
        </div>
      </div>
      {linkImg && (
        <div className="fixed inset-0 z-[70] bg-black/50 flex items-center justify-center p-4" onClick={() => setLinkImg(null)}>
          <div className="bg-white rounded-2xl p-4 w-full max-w-md shadow-2xl" onClick={(e) => e.stopPropagation()}>
            <div className="font-bold text-sm mb-1">📅 投稿予定と紐付け</div>
            <div className="text-xs text-slate-500 mb-3 break-all">{safeNameStr(linkImg.folderName || linkImg.titleText || 'image')}.jpg</div>
            <select value={linkSchedId} onChange={(e) => setLinkSchedId(e.target.value)} className="w-full p-2 border rounded text-sm">
              <option value="">予定を選択してください</option>
              {selectableScheds(schedules).map(x => (
                <option key={x.id} value={x.id}>{schedOptionLabel(x)}</option>
              ))}
            </select>
            <p className="text-[11px] text-slate-500 mt-2">紐付けると予定側にも画像タイトルが入ります（🖼️作成済の予定を選ぶと上書き）</p>
            <div className="flex gap-2 mt-3">
              <button onClick={doLinkImage} className="flex-1 bg-emerald-600 hover:bg-emerald-700 text-white rounded-lg py-2 text-sm font-medium">紐付ける</button>
              {linkImg.linkedScheduleId ? <button onClick={doUnlinkImage} className="px-3 border border-red-200 rounded-lg text-sm text-red-600 hover:bg-red-50">解除</button> : null}
              <button onClick={() => setLinkImg(null)} className="px-3 border rounded-lg text-sm text-slate-600 hover:bg-slate-50">閉じる</button>
            </div>
          </div>
        </div>
      )}
      {editing && (
        <EditImageModal img={editing} accounts={accounts} categories={categories}
          onSave={async (patch) => { await moveImage(editing, patch.accountId, patch.categoryId); setEditing(null); }}
          onSaveMeta={async (patch) => {
            const a = accounts.find(x => x.id === patch.accountId);
            const c = patch.categoryId ? categories.find(x => x.id === patch.categoryId) : null;
            const newFolder = buildFolderName({ accountName: a?.name || '', categoryName: c?.name || '', date: patch.date, memo: patch.memo });
            await updateDoc(docRefFn('shared_thumbnails', editing.id), {
              accountId: patch.accountId, accountName: a?.name || '',
              categoryId: patch.categoryId || null, categoryName: c?.name || '',
              date: patch.date, memo: patch.memo, folderName: newFolder,
            });
            showToast('保存しました');
            setEditing(null);
          }}
          onClose={() => setEditing(null)}
        />
      )}
      {confirm && <ConfirmModal {...confirm} />}
    </div>
  );
}

function EditImageModal({ img, accounts, categories, onSaveMeta, onClose }) {
  const [accountId, setAccountId] = useState(img.accountId || '');
  const [categoryId, setCategoryId] = useState(img.categoryId || '');
  const [dateVal, setDateVal] = useState(img.date || '');
  const [memo, setMemo] = useState(img.memo || '');
  const cats = categories.filter(c => c.accountId === accountId);
  useEffect(() => { if (!cats.find(c => c.id === categoryId)) setCategoryId(''); }, [accountId]);
  const a = accounts.find(x => x.id === accountId);
  const c = categories.find(x => x.id === categoryId);
  const preview = buildFolderName({ accountName: a?.name || '', categoryName: c?.name || '', date: dateVal, memo });
  return (
    <div className="fixed inset-0 bg-slate-900/60 z-[110] flex items-center justify-center p-4">
      <div className="bg-white rounded-2xl shadow-2xl p-5 max-w-md w-full space-y-3">
        <h3 className="font-bold text-slate-800">分類を変更</h3>
        <div className="space-y-2">
          <label className="text-xs font-medium text-slate-500">運用アカウント</label>
          <select value={accountId} onChange={(e) => setAccountId(e.target.value)} className="w-full p-2 border rounded text-sm">
            <option value="">選択</option>
            {accounts.map(a => <option key={a.id} value={a.id}>{a.name}</option>)}
          </select>
        </div>
        <div className="space-y-2">
          <label className="text-xs font-medium text-slate-500">画像カテゴリ</label>
          <select value={categoryId} onChange={(e) => setCategoryId(e.target.value)} disabled={!accountId} className="w-full p-2 border rounded text-sm">
            <option value="">選択</option>
            {cats.map(c => <option key={c.id} value={c.id}>{c.name}</option>)}
          </select>
        </div>
        <div className="grid grid-cols-2 gap-2">
          <div>
            <label className="text-xs font-medium text-slate-500">日付 (MM-DD)</label>
            <input value={dateVal} onChange={(e) => setDateVal(e.target.value)} placeholder="07-08" className="w-full p-2 border rounded text-sm" />
          </div>
          <div>
            <label className="text-xs font-medium text-slate-500">任意テキスト</label>
            <input value={memo} onChange={(e) => setMemo(e.target.value)} className="w-full p-2 border rounded text-sm" />
          </div>
        </div>
        <div className="bg-slate-50 border rounded p-2 text-xs">
          <div className="text-slate-500 mb-1">新しいフォルダ名</div>
          <div className="font-mono break-all">{preview}</div>
        </div>
        <div className="flex justify-end gap-2 pt-1">
          <button onClick={onClose} className="px-4 py-2 rounded-lg bg-slate-100 hover:bg-slate-200 text-slate-700 text-sm font-medium">キャンセル</button>
          <button onClick={() => onSaveMeta({ accountId, categoryId, date: dateVal, memo })} disabled={!accountId} className="px-4 py-2 rounded-lg bg-blue-600 hover:bg-blue-700 disabled:bg-slate-300 text-white text-sm font-medium">保存</button>
        </div>
      </div>
    </div>
  );
}

// ============ ViewerMode（?id=xxx 単独閲覧） ============
function ViewerMode({ id, showToast }) {
  const [data, setData] = useState(null);
  const [notFound, setNotFound] = useState(false);
  useEffect(() => {
    (async () => {
      try {
        const s = await getDoc(docRefFn('shared_thumbnails', id));
        if (!s.exists()) { setNotFound(true); return; }
        setData({ id: s.id, ...s.data() });
      } catch (e) { console.error(e); setNotFound(true); }
    })();
  }, [id]);
  if (notFound) return (
    <div className="h-screen flex flex-col items-center justify-center text-slate-500 space-y-3">
      <ImageIcon className="w-14 h-14 opacity-40" />
      <p>画像が見つかりません（削除された可能性があります）</p>
      <a href={location.pathname} className="text-blue-600 underline text-sm">ツールを開く</a>
    </div>
  );
  if (!data) return <div className="h-screen flex items-center justify-center text-slate-500"><Loader2 className="w-6 h-6 animate-spin mr-2" />読み込み中…</div>;
  return (
    <div className="min-h-screen bg-slate-900 text-white flex flex-col">
      <header className="p-4 flex items-center justify-between border-b border-slate-700">
        <a href={location.pathname} className="text-sm text-slate-300 hover:text-white flex items-center gap-1"><ChevronLeft className="w-4 h-4" />ツールへ戻る</a>
        <div className="text-xs text-slate-400">{fmtDateTime(data.createdAt)}</div>
      </header>
      <div className="flex-1 flex flex-col items-center justify-center p-4">
        <img src={data.imageUrl} alt={data.folderName} className="max-w-full max-h-[70vh] rounded shadow-2xl bg-white" />
        <p className="mt-4 font-mono break-all text-center text-sm text-slate-200">{data.folderName || data.titleText || '（未分類）'}</p>
        <div className="mt-4 flex gap-2">
          <button onClick={() => { const a = document.createElement('a'); a.download = `${safeNameStr(data.folderName || data.titleText || 'image')}.jpg`; a.href = data.imageUrl; a.click(); }} className="bg-blue-600 hover:bg-blue-700 px-4 py-2 rounded-lg text-sm font-medium flex items-center gap-2"><Download className="w-4 h-4" />画像をダウンロード</button>
          <button onClick={async () => { await copyToClipboard(location.href); showToast('リンクをコピーしました'); }} className="bg-slate-700 hover:bg-slate-600 px-4 py-2 rounded-lg text-sm font-medium flex items-center gap-2"><Copy className="w-4 h-4" />リンクをコピー</button>
        </div>
      </div>
    </div>
  );
}

// ============ Main App ============
function App() {
  const params = new URLSearchParams(location.search);
  const viewerId = params.get('id');
  const [user, setUser] = useState(null);
  const [accounts, setAccounts] = useState([]);
  const [categories, setCategories] = useState([]);
  const [projects, setProjects] = useState([]);
  const [images, setImages] = useState([]);
  const [imagesLoaded, setImagesLoaded] = useState(false);
  const [schedules, setSchedules] = useState([]);
  const [designTemplates, setDesignTemplates] = useState([]);
  const [tplConfirm, setTplConfirm] = useState(null);
  const [selectedProjectId, setSelectedProjectId] = useLocalStorage('selected_project_id', null);
  // 最初はギャラリー。統合ツールから ?sched=ID で来たときは作成画面へ
  const [view, setView] = useState(params.get('sched') ? 'create' : 'gallery');
  const [menuOpen, setMenuOpen] = useState(false);
  const [editImg, setEditImg] = useState(null);
  const [highlightId, setHighlightId] = useState('');
  const [toastMsg, setToastMsg] = useState('');
  const showToast = (m) => { setToastMsg(m); setTimeout(() => setToastMsg(''), 3000); };

  useEffect(() => {
    if (!auth) return;
    signInAnonymously(auth).catch(e => console.error("Auth error", e));
    const unsub = onAuthStateChanged(auth, setUser);
    return () => unsub();
  }, []);

  useEffect(() => {
    if (!user || !db) return;
    const subs = [
      onSnapshot(colRef('accounts'), s => { const arr = []; s.forEach(d => arr.push({ id: d.id, ...d.data() })); arr.sort((a,b) => (a.createdAt||0) - (b.createdAt||0)); setAccounts(arr); }),
      onSnapshot(colRef('categories'), s => { const arr = []; s.forEach(d => arr.push({ id: d.id, ...d.data() })); arr.sort((a,b) => (a.createdAt||0) - (b.createdAt||0)); setCategories(arr); }),
      onSnapshot(colRef('projects'), s => { const arr = []; s.forEach(d => arr.push({ id: d.id, ...d.data() })); arr.sort((a,b) => (a.createdAt||0) - (b.createdAt||0)); setProjects(arr); }),
      onSnapshot(colRef('shared_thumbnails'), s => { const arr = []; s.forEach(d => arr.push({ id: d.id, ...d.data() })); arr.sort((a,b) => (b.createdAt||0) - (a.createdAt||0)); setImages(arr); setImagesLoaded(true); }),
      onSnapshot(colRef('studio_schedule'), s => { const arr = []; s.forEach(d => arr.push({ id: d.id, ...d.data() })); arr.sort((a,b) => (a.date||'9999').localeCompare(b.date||'9999')); setSchedules(arr); }),
      onSnapshot(colRef('thumb_design_templates'), s => { const arr = []; s.forEach(d => arr.push({ id: d.id, ...d.data() })); arr.sort((a,b) => (a.createdAt||0) - (b.createdAt||0)); setDesignTemplates(arr); }),
    ];
    return () => subs.forEach(u => u());
  }, [user]);

  if (viewerId) return (<><Toast msg={toastMsg} /><ViewerMode id={viewerId} showToast={showToast} /></>);
  const selectedProject = projects.find(p => p.id === selectedProjectId) || null;
  const saveTemplate = async (name, design) => { try { await addDoc(colRef('thumb_design_templates'), { name, design, createdAt: Date.now(), authorId: user ? user.uid : '' }); showToast(`「${name}」を保存しました`); } catch (e) { console.error(e); showToast('保存に失敗しました'); } };
  const deleteTemplate = (t) => setTplConfirm({ title: `「${t.name}」を削除しますか？`, body: 'チーム全員のマイテンプレから消えます', confirmLabel: '削除', onCancel: () => setTplConfirm(null), onConfirm: async () => { try { await deleteDoc(docRefFn('thumb_design_templates', t.id)); showToast('削除しました'); } catch (e) { showToast('削除に失敗しました'); } setTplConfirm(null); } });
  const goGallery = (hl) => { setView('gallery'); setEditImg(null); if (hl) { setHighlightId(hl); setTimeout(() => setHighlightId(''), 4000); } window.scrollTo(0, 0); };
  return (
    <div className="flex flex-col h-screen bg-slate-50 text-slate-800">
      <Toast msg={toastMsg} />
      <Header view={view} onHome={() => goGallery()} onMenu={() => setMenuOpen(true)} />
      {view === 'gallery' && (
        <GalleryModal page images={images} accounts={accounts} categories={categories} showToast={showToast} schedules={schedules}
          loading={!imagesLoaded}
          highlightId={highlightId}
          onCreate={() => { setEditImg(null); setView('create'); }}
          onRegister={() => { setEditImg(null); setView('register'); }}
          onEdit={(img) => { setEditImg({ ...img, _t: Date.now() }); setView('create'); }} />
      )}
      {(view === 'create' || view === 'register') && (
        <CreateTab key={view} mode={view} user={user} accounts={accounts} categories={categories} projects={projects}
          selectedProject={selectedProject} showToast={showToast} openGallery={() => goGallery()} schedules={schedules} editImg={editImg}
          onSaved={(id) => { setHighlightId(id); }} designTemplates={designTemplates} onSaveTemplate={saveTemplate} onDeleteTemplate={deleteTemplate} />
      )}
      {tplConfirm && <ConfirmModal {...tplConfirm} />}
      {menuOpen && (
        <HamburgerMenu onClose={() => setMenuOpen(false)}
          accounts={accounts} categories={categories} projects={projects}
          selectedProjectId={selectedProjectId} setSelectedProjectId={setSelectedProjectId}
          showToast={showToast} />
      )}
    </div>
  );
}

function Root() {
  const [unlocked, setUnlocked] = useState(localStorage.getItem('meo_unlocked') === '1');
  if (!unlocked) return <PassphraseGate onUnlock={() => setUnlocked(true)} />;
  return <App />;
}

createRoot(document.getElementById('root')).render(<Root />);
</script>
</body>
</html>
